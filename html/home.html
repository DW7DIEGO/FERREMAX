<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerreMax - Tu Ferretería Online</title>
    <meta name="description" content="FerreMax: herramientas, electricidad, plomería, construcción y jardín con los mejores precios.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/icons.css">
</head>
<body>
    <header id="header">
        <!-- Header will be loaded via JavaScript -->
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Herramientas y materiales</h1>
                <p>Explora el catálogo de ferretería por categoría y consulta las existencias antes de comprar.</p>
                <a href="products.html" class="btn btn-primary">Explorar catálogo &nbsp; →</a>
            </div>
        </section>

        <section class="featured-categories">
            <h2>Comprar por categoría</h2>
            <div class="categories-grid">
                <a class="category-card" href="products.html?category=herramientas">
                    <div class="category-icon"><i class="fas fa-wrench"></i></div>
                    <h3>Herramientas</h3>
                </a>
                <a class="category-card" href="products.html?category=construccion">
                    <div class="category-icon"><i class="fas fa-hard-hat"></i></div>
                    <h3>Construcción</h3>
                </a>
                <a class="category-card" href="products.html?category=iluminacion">
                    <div class="category-icon"><i class="fas fa-lightbulb"></i></div>
                    <h3>Iluminación</h3>
                </a>
                <a class="category-card" href="products.html?category=jardin">
                    <div class="category-icon"><i class="fas fa-leaf"></i></div>
                    <h3>Jardín</h3>
                </a>
            </div>
        </section>

        <section class="featured-products">
            <h2>Productos destacados</h2>
            <div class="products-grid" id="featured-products">
                <!-- Products will be loaded via JavaScript -->
            </div>
        </section>

    </main>

    <footer id="footer">
        <!-- Footer will be loaded via JavaScript -->
    </footer>

    <script src="../js/config.js"></script>

    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/products.js"></script>

</body>
</html>
