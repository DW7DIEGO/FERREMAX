<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - FerreMax</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/product-detail.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/storefront.css">
</head>
<body class="storefront">
    <header id="header">
        <!-- Header will be loaded via JavaScript -->
    </header>

    <main>
        <div class="product-container">
            <div class="breadcrumb">
                <a href="home.html">Inicio</a> > 
                <a href="products.html">Productos</a> >
                <a id="product-category-link" href="products.html">Categoría</a> >
                <span id="product-breadcrumb-name">Detalle de Producto</span>
            </div>
            
            <div class="product-content">
                <div class="product-gallery">
                    <div class="main-image">
                        <img id="product-main-image" alt="Producto">
                    </div>
                    <div class="product-thumbnails">
                    </div>
                </div>
                
                <div class="product-details">
                    <div class="product-info">
                        <h1 id="product-name"></h1>
                        <div class="product-meta">
                            <div class="product-rating"></div>
                            <div class="product-code">Código: <span id="product-code"></span></div>
                        </div>
                        
                        <div class="product-price-container">
                            <div class="price-info">
                                <span class="old-price" id="product-old-price"></span>
                                <span class="current-price" id="product-price"></span>
                                <span class="discount-badge">-20%</span>
                            </div>
                            <span class="product-availability status"></span>
                        </div>
                        
                        <div class="product-short-description">
                            <p id="product-short-desc"></p>
                        </div>
                        
                        <div class="product-actions">
                            <div class="quantity-control">
                                <button class="quantity-btn" id="decrease-quantity">-</button>
                                <input type="number" id="product-quantity" value="1" min="1">
                                <button class="quantity-btn" id="increase-quantity">+</button>
                            </div>
                            <button class="btn btn-primary" id="add-to-cart">
                                <i class="fas fa-cart-plus"></i> Añadir al Carrito
                            </button>
                            <button class="btn btn-icon" id="add-to-wishlist">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                        
                        <div class="product-additional-info">
                            <div class="info-item">
                                <i class="fas fa-truck"></i>
                                <span>Envío gratis en pedidos superiores a $ 200.000</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-shield-alt"></i>
                                <span>Garantía de 2 años</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-exchange-alt"></i>
                                <span>30 días para devoluciones</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="product-tabs">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="description">Descripción</button>
                    <button class="tab-btn" data-tab="specifications">Especificaciones</button>
                    <button class="tab-btn" data-tab="reviews">Valoraciones</button>
                </div>
                
                <div class="tab-content">
                    <div id="description" class="tab-pane active">
                        <h3>Descripción del Producto</h3>
                        <p id="product-description"></p>
                    </div>
                    <div id="specifications" class="tab-pane">
                        <h3>Ficha técnica</h3>
                        <table class="specs-table"><tbody id="spec-rows"></tbody></table>
                    </div>
                    <div id="reviews" class="tab-pane">
                        <h3>Valoraciones del producto</h3><p id="review-summary"></p>
                    </div>
                </div>
            </div>
            <section class="related-products">
                <h2>Productos Relacionados</h2>
                <div class="products-grid" id="related-products">
                    <!-- Related products will be loaded via JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <footer id="footer">
        <!-- Footer will be loaded via JavaScript -->
    </footer>

    <script src="../js/config.js"></script>

    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/product-detail.js"></script>
</body>
</html>
